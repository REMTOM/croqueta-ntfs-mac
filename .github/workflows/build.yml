name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Compilar app
        run: ./build.sh

      - name: Comprobar scripts
        run: |
          brew install shellcheck
          shellcheck -S error build.sh install.sh uninstall.sh helper/croqueta-ntfs-helper helper/empaquetar-ntfs3g.sh \
            installer/make-pkg.sh installer/scripts/preinstall installer/scripts/postinstall

      - name: Validar distribution.xml
        run: xmllint --noout installer/distribution.xml
